<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Excel to Zoho Creator - Pincode Import</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 20px;
}
.container {
    max-width: 1200px;
    margin: auto;
    background: #fff;
    border-radius: 10px;
    padding: 20px;
}
.upload-area {
    border: 2px dashed #5e72e4;
    padding: 40px;
    text-align: center;
    cursor: pointer;
}
.upload-area:hover {
    background: #f2f4ff;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
th, td {
    border: 1px solid #ddd;
    padding: 8px;
}
th {
    background: #5e72e4;
    color: #fff;
}
.btn {
    margin-top: 20px;
    padding: 10px 25px;
    border: none;
    background: #28a745;
    color: #fff;
    cursor: pointer;
}
.btn:hover {
    background: #218838;
}
.loading {
    display: none;
    margin-top: 15px;
}
</style>
</head>

<body>
<div class="container">
    <h2>Excel to Zoho Creator – Pincode Import</h2>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        Click to upload Excel (.xlsx / .csv)
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
    </div>

    <div class="loading" id="loading">Processing file...</div>

    <table id="previewTable">
        <thead></thead>
        <tbody></tbody>
    </table>

    <button class="btn" onclick="importToZoho()">Import to Zoho Creator</button>

    <div class="loading" id="uploadProgress">Uploading...</div>
</div>

<script>
let excelData = [];
let headers = [];

/* ---------------- CLEAN & VALIDATE ---------------- */
function cleanPincode(val) {
    if (!val) return null;
    const pin = val.toString().trim();
    return /^\d{6}$/.test(pin) ? pin : null;
}

/* ---------------- BATCH SPLIT ---------------- */
function chunkArray(arr, size) {
    const res = [];
    for (let i = 0; i < arr.length; i += size) {
        res.push(arr.slice(i, i + size));
    }
    return res;
}

/* ---------------- FILE READ ---------------- */
document.getElementById("fileInput").addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById("loading").style.display = "block";

    const reader = new FileReader();
    reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        headers = json[0];
        excelData = json.slice(1).map(r => ({ Pincode: r[0] }));

        renderTable();
        document.getElementById("loading").style.display = "none";
    };
    reader.readAsArrayBuffer(file);
});

/* ---------------- PREVIEW ---------------- */
function renderTable() {
    const thead = document.querySelector("#previewTable thead");
    const tbody = document.querySelector("#previewTable tbody");
    thead.innerHTML = "<tr><th>Pincode</th></tr>";
    tbody.innerHTML = "";

    excelData.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${r.Pincode || ""}</td>`;
        tbody.appendChild(tr);
    });
}

/* ---------------- ZOHO API ---------------- */
async function addRecords(records, batchNo) {
    const res = await fetch(
        "https://www.zohoapis.in/creator/v2.1/data/YOUR_APP_LINK_NAME/form/YOUR_FORM_LINK_NAME",
        {
            method: "POST",
            headers: {
                "Authorization": "Zoho-oauthtoken YOUR_OAUTH_TOKEN",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ data: records })
        }
    );

    const result = await res.json();

    if (!res.ok || result.code !== 3000) {
        console.error("Batch Failed:", batchNo, result);
        throw result;
    }

    console.log("Batch Success:", batchNo, result);
}

/* ---------------- IMPORT ---------------- */
function importToZoho() {

    const validRecords = excelData
        .map(r => ({ Pincode: cleanPincode(r.Pincode) }))
        .filter(r => r.Pincode);

    if (validRecords.length === 0) {
        alert("No valid pincodes found");
        return;
    }

    const batches = chunkArray(validRecords, 200);
    let index = 0;

    const progress = document.getElementById("uploadProgress");
    progress.style.display = "block";

    function nextBatch() {
        if (index >= batches.length) {
            progress.innerText = "Import completed successfully";
            return;
        }

        progress.innerText = `Uploading batch ${index + 1} of ${batches.length}`;

        addRecords(batches[index], index + 1)
            .then(() => {
                index++;
                nextBatch();
            })
            .catch(err => {
                progress.style.display = "none";
                alert(
                    "Batch " + (index + 1) + " failed\n\n" +
                    JSON.stringify(err, null, 2)
                );
            });
    }

    ZOHO.embeddedApp.init().then(nextBatch);
}
</script>
</body>
</html>
