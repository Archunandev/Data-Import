<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel to Zoho Creator - Data Reader Widget</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- YOUR ORIGINAL STYLE (UNCHANGED) -->
<style>
/* === SAME STYLE AS YOU PROVIDED === */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
.container{max-width:1400px;margin:auto;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.header{background:linear-gradient(135deg,#5e72e4,#825ee4);color:#fff;padding:30px;text-align:center}
.upload-section,.data-section{padding:40px}
.upload-area{border:3px dashed #5e72e4;border-radius:15px;padding:40px;text-align:center;cursor:pointer}
.loading{display:none;text-align:center;padding:20px}
.loading.show{display:block}
.spinner{border:3px solid #f3f3f3;border-top:3px solid #5e72e4;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:auto}
@keyframes spin{100%{transform:rotate(360deg)}}
.btn{padding:12px 30px;border:none;border-radius:8px;font-size:16px;cursor:pointer}
.btn-success{background:#28a745;color:#fff}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee}
th{background:#5e72e4;color:#fff;position:sticky;top:0}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>Excel to Zoho Creator Data Importer</h1>
<p>Pincode Import Widget</p>
</div>

<div class="upload-section">
<div class="upload-area" onclick="fileInput.click()">
Click to upload Excel
<input type="file" id="fileInput" hidden accept=".xlsx,.xls,.csv">
</div>

<div class="loading" id="loading">
<div class="spinner"></div>
Processing file...
</div>
</div>

<div class="data-section" id="dataSection" style="display:none">
<table>
<thead id="tableHead"></thead>
<tbody id="tableBody"></tbody>
</table>

<div class="loading" id="uploadProgress">
<div class="spinner"></div>
<div id="progressText"></div>
</div>

<button class="btn btn-success" onclick="importToZoho()">Import to Zoho Creator</button>
</div>

</div>

<script>
let excelData = [];
let headers = [];

/* ---------- CLEAN PINCODE ---------- */
function cleanPincode(val) {
    if (!val) return null;
    const p = val.toString().trim();
    return /^\d{6}$/.test(p) ? p : null;
}

/* ---------- BATCH ---------- */
function chunkArray(arr, size) {
    const out = [];
    for (let i = 0; i < arr.length; i += size)
        out.push(arr.slice(i, i + size));
    return out;
}

/* ---------- FILE READ ---------- */
fileInput.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;

    loading.classList.add("show");

    const reader = new FileReader();
    reader.onload = ev => {
        const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });

        headers = rows[0];
        excelData = rows.slice(1).map(r => ({ Pincode: r[0] }));

        renderTable();
        loading.classList.remove("show");
    };
    reader.readAsArrayBuffer(file);
});

/* ---------- PREVIEW ---------- */
function renderTable() {
    dataSection.style.display = "block";
    tableHead.innerHTML = "<tr><th>Pincode</th></tr>";
    tableBody.innerHTML = "";

    excelData.forEach(r => {
        tableBody.innerHTML += `<tr><td>${r.Pincode || ""}</td></tr>`;
    });
}

/* ---------- ZOHO API ---------- */
async function addRecords(records, batchNo) {
    const res = await fetch(
        "https://www.zohoapis.in/creator/v2.1/data/ingotdms/cry/form/Pincode",
        {
            method: "POST",
            headers: {
                "Authorization": "Zoho-oauthtoken YOUR_TOKEN",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ data: records })
        }
    );

    const result = await res.json();

    if (!res.ok || result.code !== 3000) {
        console.error("Batch Failed", batchNo, result);
        throw result;
    }

    console.log("Batch Success", batchNo, result);
}

/* ---------- IMPORT ---------- */
function importToZoho() {

    const valid = excelData
        .map(r => ({ Pincode: cleanPincode(r.Pincode) }))
        .filter(r => r.Pincode);

    if (!valid.length) {
        alert("No valid pincodes found");
        return;
    }

    const batches = chunkArray(valid, 200);
    let index = 0;

    uploadProgress.classList.add("show");

    function next() {
        if (index >= batches.length) {
            progressText.innerText = "Import completed successfully";
            return;
        }

        progressText.innerText = `Uploading batch ${index + 1} of ${batches.length}`;

        addRecords(batches[index], index + 1)
            .then(() => { index++; next(); })
            .catch(err => {
                uploadProgress.classList.remove("show");
                alert(
                    `Batch ${index + 1} failed\n\n` +
                    JSON.stringify(err, null, 2)
                );
            });
    }

    ZOHO.embeddedApp.init().then(next);
}
</script>

</body>
</html>
